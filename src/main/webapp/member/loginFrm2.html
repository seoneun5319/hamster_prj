<script>
window.onload=function(){
document.getElementById("floatingInput").addEventListener("keyup",enter)
document.getElementById("floatingPassword").addEventListener("keyup",enter)
document.getElementById("loginbtn").addEventListener("click",chkNull)
}

function enter(evt){
	if (evt.which == 13) {//엔터가 눌리면
		chkNull();
	}
}

function chkNull(evt){
	var obj=document.loginFrm;
	var id=obj.floatingInput.value;
	var pass=obj.floatingPassword.value;
	
	if (id == "") {
		alert("아이디는 필수 입력 입니다.")
		obj.id.focus();
		return;
	}
	
	if (pass == "") {
		alert("비밀번호는 필수 입력 입니다.")
		obj.pass.focus();
		return;
	}
	
	obj.submit();//form 태그에 action이 설정된 페이지로 이동
	
}//chkNull

</script>

<main class="form-signin w-100 m-auto">
  <form name="loginFrm" action="loginprocess.jsp">
    <h1 class="h3 mb-3 fw-normal">로그인</h1>

    <div class="form-floating">
      <input type="email" class="form-control" name="id" id="floatingInput" placeholder="아이디">
      <label for="floatingInput" >아이디</label>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" name="pass" id="floatingPassword" placeholder="비밀번호">
      <label for="floatingPassword" >비밀번호</label>
    </div>
